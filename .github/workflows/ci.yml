name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: ESLint
        run: npm run lint:eslint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  # The Firestore security rules run against the real emulator, so a change that
  # re-opens the user document, the integration credentials or the append-only
  # price log fails here instead of reaching production.
  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Test the Firestore rules
        run: npm run test:rules

  # The phone app (mobile/) has its own dependencies, tests and config: this runs its tests, checks its types, and
  # checks that it still bundles for Android.
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      # The app's tests import vitest, which lives in the main project.
      - name: Install main dependencies
        run: npm ci

      - name: Install the app's dependencies
        run: npm ci
        working-directory: mobile

      - name: Type-check the app
        run: npx tsc --noEmit
        working-directory: mobile

      - name: Test the app's logic
        run: npm test
        working-directory: mobile

      - name: Bundle the app for Android
        run: npx expo export --platform android
        working-directory: mobile
        env:
          CI: '1'
          EXPO_PUBLIC_API_URL: https://example.invalid
